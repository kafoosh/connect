<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eef2f8">
<title>Connect 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fd9'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23e5383b'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23b8262a' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #eef2f8;
  --board: #1f5fd9;
  --board-edge: #174cb4;
  --hole: #eef2f8;
  --hole-ring: #13429e;
  --p1: #e5383b;
  --p1-edge: #b8262a;
  --p2: #fcc419;
  --p2-edge: #d9a20c;
  --screw: #dfe7f6;
  --screw-slot: #6f87b8;
  --ui: #1f5fd9;
  --lane: rgba(255, 255, 255, .13);
  --radius: 26px;
}
html[data-theme="flat"] {
  --bg: #f7f3ec;
  --board: #ffffff;
  --board-edge: #ffffff;
  --hole: #efe9df;
  --hole-ring: #e4dccf;
  --p1: #f2545b;
  --p1-edge: #f2545b;
  --p2: #f7b32b;
  --p2-edge: #f7b32b;
  --screw: #efe9df;
  --screw-slot: #cfc5b5;
  --ui: #3a3a3a;
  --lane: rgba(120, 95, 60, .07);
  --radius: 30px;
}
html[data-theme="night"] {
  --bg: #0e1222;
  --board: #1a2142;
  --board-edge: #252e5a;
  --hole: #0e1222;
  --hole-ring: #2d3870;
  --p1: #ff4f6d;
  --p1-edge: #c9324e;
  --p2: #ffd34e;
  --p2-edge: #d4a92c;
  --screw: #2a3466;
  --screw-slot: #4d5b9c;
  --ui: #8fa2ff;
  --lane: rgba(143, 162, 255, .09);
  --radius: 26px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
main {
  width: min(94vw, 560px, calc((100dvh - 120px) * 0.84));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}
svg#game { width: 100%; height: auto; display: block; overflow: visible; cursor: grab; touch-action: none; }
svg#game.dragging { cursor: grabbing; }
.board { fill: var(--board); }
.ring { fill: none; stroke: var(--hole-ring); stroke-width: 5; transition: stroke .25s; }
.p1 .face { fill: var(--p1); }
.p1 .rim { stroke: var(--p1-edge); }
.p2 .face { fill: var(--p2); }
.p2 .rim { stroke: var(--p2-edge); }
.rim { fill: none; stroke-width: 6; opacity: .9; }
.disc.dim { opacity: .35; transition: opacity .4s; }
.disc.win .face { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.25); } }
.win-ring { fill: none; stroke: #fff; stroke-width: 6; opacity: .9; }
.screw circle { fill: var(--screw); }
.screw line { stroke: var(--screw-slot); stroke-width: 3; stroke-linecap: round; }
#preview { transition: transform .12s ease-out, opacity .15s; }
#preview.live { transition: opacity .15s; }
#preview.hidden { opacity: 0; }
#labels { display: none; }
html.audio #labels { display: inline; }
#labels text { fill: var(--ui); opacity: .75; font: 600 38px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
#lane { fill: var(--lane); opacity: 0; transition: opacity .15s; pointer-events: none; }
#lane.on { opacity: 1; }

.bar { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 6px; }
.turn { display: flex; gap: 12px; align-items: center; }
.chip {
  width: 30px; height: 30px; border-radius: 50%;
  transform: scale(.72); opacity: .45;
  transition: transform .2s, opacity .2s, box-shadow .2s;
}
.chip.p1 { background: var(--p1); box-shadow: inset 0 0 0 4px var(--p1-edge); }
.chip.p2 { background: var(--p2); box-shadow: inset 0 0 0 4px var(--p2-edge); }
.chip.on { transform: scale(1); opacity: 1; }
button#sound {
  width: 40px; height: 40px; border: 0; padding: 0; margin-left: 2px; border-radius: 50%;
  background: transparent; color: var(--ui); opacity: .55; cursor: pointer; display: grid; place-items: center;
}
button#sound .off { display: none; }
button#sound.muted { opacity: .35; }
button#sound.muted .on { display: none; }
button#sound.muted .off { display: inline; }
#restart { -webkit-touch-callout: none; }
#result {
  font: 800 54px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-anchor: middle; dominant-baseline: central;
  opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center;
  paint-order: stroke; stroke: var(--bg); stroke-width: 10px; stroke-linejoin: round;
}
#result.p1 { fill: var(--p1-edge); }
#result.p2 { fill: var(--p2-edge); }
#result.p3 { fill: var(--ui); }
#result.show { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.chip.won { animation: bob .7s ease-in-out infinite alternate; }
@keyframes bob { from { transform: scale(1) translateY(0); } to { transform: scale(1.08) translateY(-4px); } }
.tools { display: flex; gap: 4px; }
.tools button {
  width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0;
  background: transparent; color: var(--ui); cursor: pointer;
  display: grid; place-items: center; opacity: .8;
  transition: opacity .2s, transform .15s;
}
.tools button:disabled { opacity: .25; cursor: default; }
button#nums { font: 700 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .5px; opacity: .45; }
html.audio button#nums { opacity: .9; }
button#undo:active:not(:disabled) { transform: translateX(-3px); }
button#restart:active, button#restart.pressed { transform: rotate(-40deg); }
button#restart.nudge { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: rotate(-30deg); opacity: 1; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>
  <svg id="game" viewBox="0 0 740 780" aria-label="Connect 4 board">
    <defs>
      <mask id="holes">
        <rect x="0" y="100" width="740" height="680" fill="#fff"/>
        <g id="hole-mask"></g>
      </mask>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
        <feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".22"/>
      </filter>
    </defs>
    <g id="labels"></g>
    <g id="preview" class="disc p1"><circle class="face" r="40"/><circle class="rim" r="29"/></g>
    <g id="discs"></g>
    <g filter="url(#shadow)">
      <rect class="board" x="0" y="100" width="740" height="680" rx="34" mask="url(#holes)"/>
    </g>
    <rect id="lane" x="26" y="110" width="88" height="620" rx="44"/>
    <g id="rings"></g>
    <g id="screws"></g>
    <g id="wins"></g>
    <text id="result" x="370" y="50"></text>
    <rect id="hit" x="0" y="0" width="740" height="780" fill="transparent"/>
  </svg>
  <div class="bar">
    <div class="turn">
      <div class="chip p1 on" id="c1"></div><div class="chip p2" id="c2"></div>
      <button id="sound" aria-label="Sound on">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6"/><path class="on" d="M18.2 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="m16 9.5 5 5m0-5-5 5"/></svg>
      </button>
    </div>
    <div class="tools">
      <button id="nums" aria-label="Column numbers">123</button>
      <button id="undo" aria-label="Undo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="restart" aria-label="New game">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Settings (kept out of sight): ?theme=classic|flat|night  ?tell=rest|screw|shade|off
// Both are remembered on this device.
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
function setting(name, allowed, fallback) {
  let v = params.get(name);
  try {
    if (v && allowed.includes(v)) localStorage.setItem("c4-" + name, v);
    else v = localStorage.getItem("c4-" + name);
  } catch (e) {}
  return allowed.includes(v) ? v : fallback;
}
const THEME = setting("theme", ["classic", "flat", "night"], "classic");
const TELL = setting("tell", ["rest", "screw", "shade", "off"], "shade");
let AUDIO = false;                 // audio mode: the signal goes to the watch (see below)
try { AUDIO = localStorage.getItem("c4-mode") === "audio"; } catch (e) {}
const tell = () => (AUDIO ? "off" : TELL); // no on-board signal in audio mode
document.documentElement.dataset.theme = THEME;
document.querySelector('meta[name="theme-color"]').content =
  getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();

// ---------------------------------------------------------------------------
// Geometry
// ---------------------------------------------------------------------------
const COLS = 7, ROWS = 6, CELL = 100, PAD = 20, TOP = 100;
const SVGNS = "http://www.w3.org/2000/svg";
const cx = c => PAD + CELL / 2 + c * CELL;
const cy = r => TOP + PAD + CELL / 2 + (ROWS - 1 - r) * CELL; // r = 0 is the bottom row
const PREVIEW_Y = 50;
const svg = document.getElementById("game");
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

const holeMask = document.getElementById("hole-mask");
const ringsG = document.getElementById("rings");
const rings = [];
for (let c = 0; c < COLS; c++) {
  rings.push([]);
  for (let r = 0; r < ROWS; r++) {
    el("circle", { cx: cx(c), cy: cy(r), r: 40, fill: "#000" }, holeMask);
    rings[c].push(el("circle", { class: "ring", cx: cx(c), cy: cy(r), r: 41.5 }, ringsG));
  }
}

// Decorative screws along the bottom rail. Each sits at its own "random"
// angle; the tell turns one slot exactly vertical.
const SCREW_ANGLES = [24, 152, 38, 166, 12, 141, 30];
const screwsG = document.getElementById("screws");
const screws = SCREW_ANGLES.map((a, c) => {
  const g = el("g", { class: "screw", transform: `translate(${cx(c)} ${TOP + 6 * CELL + PAD + 30})` }, screwsG);
  el("circle", { r: 8 }, g);
  const slot = el("line", { x1: -5, y1: 0, x2: 5, y2: 0, transform: `rotate(${a})` }, g);
  return slot;
});

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
let grid, heights, discEls, moves, turn, over, busy, hint, solveId = 0;
const discsG = document.getElementById("discs");
const winsG = document.getElementById("wins");
const preview = document.getElementById("preview");
let pointerX = null;   // board x of the mouse/finger while hovering or dragging
let dragId = null;     // pointer currently dragging the disc
let lastCol = null, lastLane = null;
const lane = document.getElementById("lane");
const undoBtn = document.getElementById("undo");

function newGame() {
  grid = Array.from({ length: COLS }, () => Array(ROWS).fill(0));
  heights = Array(COLS).fill(0);
  discEls = Array.from({ length: COLS }, () => Array(ROWS).fill(null));
  moves = "";
  turn = 1;
  busy = false;
  lastCol = null;
  discsG.textContent = "";
  clearResult();
  solveId++;
  setHint(null);
  updateTurn();
  requestHint();
}

function clearResult() {
  over = false;
  hideResult();
  winsG.textContent = "";
  for (const n of discsG.children) n.classList.remove("dim");
  document.getElementById("restart").classList.remove("nudge");
  document.getElementById("c1").classList.remove("won");
  document.getElementById("c2").classList.remove("won");
}

function undo() {
  if (busy || !moves.length) return;
  const c = moves.charCodeAt(moves.length - 1) - 49;
  moves = moves.slice(0, -1);
  const r = --heights[c];
  turn = grid[c][r];
  grid[c][r] = 0;
  discEls[c][r].remove();
  discEls[c][r] = null;
  lastCol = moves.length ? moves.charCodeAt(moves.length - 1) - 49 : null;
  clearResult();
  solveId++;
  setHint(null);
  updateTurn();
  requestHint();
}

function updateTurn() {
  undoBtn.disabled = moves.length === 0;
  let shown = over ? over : turn;
  if (listening && !over) shown = 3 - shown;      // secret sign: listening for the chime
  document.getElementById("c1").classList.toggle("on", over === 3 ? false : shown === 1);
  document.getElementById("c2").classList.toggle("on", over === 3 ? false : shown === 2);
  preview.classList.remove("p1", "p2");
  preview.classList.add("p" + turn);
  preview.classList.toggle("hidden", !!(over || busy));
  placePreview();
}

function placePreview() {
  const live = pointerX !== null && !over && !busy;
  let x;
  if (live) x = Math.max(cx(0), Math.min(cx(COLS - 1), pointerX));
  else {
    // Resting position when no pointer is over the board.
    let c;
    if (turn === 1 && hint !== null && tell() === "rest") c = hint;
    else c = lastCol !== null ? lastCol : 3;
    x = cx(c);
  }
  preview.classList.toggle("live", live);
  preview.setAttribute("transform", `translate(${x} ${PREVIEW_Y})`);
  // subtle lane over the column the disc would fall into
  const c = colOf(x);
  if (live && c !== lastLane) tick();
  lastLane = live ? c : null;
  lane.setAttribute("x", PAD + c * CELL + 6);
  lane.classList.toggle("on", live && heights[c] < ROWS);
}

function makeDisc(player) {
  const g = el("g", { class: "disc p" + player }, discsG);
  el("circle", { class: "face", r: 40 }, g);
  el("circle", { class: "rim", r: 29 }, g);
  return g;
}

function drop(c) {
  if (over || busy || heights[c] >= ROWS) return;
  const r = heights[c]++;
  const player = turn;
  grid[c][r] = player;
  moves += c + 1;
  lastCol = c;
  busy = true;
  setHint(null);
  const disc = makeDisc(player);
  discEls[c][r] = disc;
  const y0 = PREVIEW_Y, y1 = cy(r);
  const x = cx(c);
  // simple gravity with one small bounce
  const g = 0.0042, dist = y1 - y0;
  const tFall = Math.sqrt(2 * dist / g);
  const vImpact = g * tFall, vBounce = vImpact * 0.18, tBounce = 2 * vBounce / g;
  const start = performance.now();
  disc.setAttribute("transform", `translate(${x} ${y0})`);
  turn = 3 - player;
  updateTurn();
  if (!checkWin(c, r, player) && moves.length < COLS * ROWS) requestHint();
  let landed = 0;
  (function frame(now) {
    const t = now - start;
    let y;
    if (t >= tFall && landed === 0) { landed = 1; clack(1); }
    if (t >= tFall + tBounce && landed === 1) { landed = 2; clack(0.3); }
    if (t < tFall) y = y0 + 0.5 * g * t * t;
    else if (t < tFall + tBounce) { const u = t - tFall; y = y1 - (vBounce * u - 0.5 * g * u * u); }
    else y = y1;
    disc.setAttribute("transform", `translate(${x} ${y})`);
    if (t < tFall + tBounce) requestAnimationFrame(frame);
    else { busy = false; afterDrop(c, r, player); }
  })(start);
}

function afterDrop(c, r, player, silent) {
  const line = checkWin(c, r, player);
  if (line) {
    over = player;
    const inLine = new Set(line.map(([cc, rr]) => discEls[cc][rr]));
    for (const n of discsG.children) if (!inLine.has(n)) n.classList.add("dim");
    for (const [cc, rr] of line) {
      el("circle", { class: "win-ring", cx: cx(cc), cy: cy(rr), r: 22 }, winsG);
    }
    document.getElementById("c" + player).classList.add("won");
    document.getElementById("restart").classList.add("nudge");
  } else if (moves.length === COLS * ROWS) {
    over = 3;
    document.getElementById("restart").classList.add("nudge");
  }
  if (over) nowPlaying(over === 1 ? "Win" : over === 2 ? "Lost" : "Draw");
  if (over) showResult(over, !silent);
  if (over && !silent) setTimeout(playChime, 120);
  updateTurn();
  showHint();
}

// ---- Celebration: "Red wins" / "Yellow wins" / "Draw" and a burst of confetti
const resultEl = document.getElementById("result");
const confettiCv = document.getElementById("confetti");
let confettiRun = 0;
function showResult(who, party) {
  resultEl.textContent = who === 1 ? "Red wins" : who === 2 ? "Yellow wins" : "Draw";
  resultEl.setAttribute("class", "p" + who);
  void resultEl.getBoundingClientRect();          // restart the pop animation
  resultEl.classList.add("show");
  if (party && who !== 3 && !matchMedia("(prefers-reduced-motion: reduce)").matches) setTimeout(() => confetti(who), 120);
}
function hideResult() {
  resultEl.setAttribute("class", "");
  confettiRun++;
  const g = confettiCv.getContext("2d");
  g.clearRect(0, 0, confettiCv.width, confettiCv.height);
}
function confetti(who) {
  const run = ++confettiRun, dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = confettiCv.width = innerWidth * dpr, H = confettiCv.height = innerHeight * dpr;
  const g = confettiCv.getContext("2d");
  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
  const colours = [v(who === 1 ? "--p1" : "--p2"), v(who === 1 ? "--p1" : "--p2"), v("--p1"), v("--p2"), v("--board"), "#ffffff"];
  const box = svg.getBoundingClientRect();
  const ox = (box.left + box.width / 2) * dpr, oy = (box.top + box.height * 0.08) * dpr;
  const bits = Array.from({ length: 160 }, () => {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, sp = (6 + Math.random() * 11) * dpr;
    return {
      x: ox + (Math.random() - 0.5) * box.width * 0.6 * dpr, y: oy,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: (6 + Math.random() * 6) * dpr, h: (3 + Math.random() * 4) * dpr,
      r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4, c: colours[Math.floor(Math.random() * colours.length)],
      round: Math.random() < 0.3,
    };
  });
  const start = performance.now();
  (function frame(now) {
    if (run !== confettiRun) return;
    const t = (now - start) / 1000;
    g.clearRect(0, 0, W, H);
    g.globalAlpha = Math.max(0, Math.min(1, (3.2 - t) / 0.8));
    for (const b of bits) {
      b.vy += 0.32 * dpr; b.vx *= 0.985; b.vy *= 0.985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c;
      if (b.round) { g.beginPath(); g.arc(0, 0, b.h * 0.9, 0, 6.3); g.fill(); }
      else g.fillRect(-b.w / 2, -b.h / 2 * Math.abs(Math.cos(b.r * 2)) - 0.5, b.w, b.h * Math.abs(Math.cos(b.r * 2)) + 1);
      g.restore();
    }
    if (t < 3.2) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
  })(start);
}

function checkWin(c, r, p) {
  const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (const [dc, dr] of dirs) {
    const line = [[c, r]];
    for (const s of [1, -1]) {
      let x = c + s * dc, y = r + s * dr;
      while (x >= 0 && x < COLS && y >= 0 && y < ROWS && grid[x][y] === p) {
        line.push([x, y]);
        x += s * dc; y += s * dr;
      }
    }
    if (line.length >= 4) return line;
  }
  return null;
}

// ---------------------------------------------------------------------------
// The secret: best column for the first player (the magician)
// ---------------------------------------------------------------------------
let pendingHint = null;
function setHint(c) {
  hint = c;
  // clear every tell
  screws.forEach((s, i) => s.setAttribute("transform", `rotate(${SCREW_ANGLES[i]})`));
  rings.forEach(col => col.forEach(ring => ring.style.stroke = ""));
  if (!over) nowPlaying("\u2014");
  placePreview();
}
function showHint() {
  if (busy || over || turn !== 1 || pendingHint === null) return;
  if (pendingHint.moves !== moves) return;
  const c = pendingHint.col;
  hint = c;
  if (tell() === "screw") screws[c].setAttribute("transform", "rotate(90)");
  if (tell() === "shade") rings[c][heights[c]].style.stroke = "var(--board)";
  nowPlaying(String(c + 1));
  placePreview();
}
function requestHint() {
  pendingHint = null;
  if (turn !== 1) return;
  const id = ++solveId, seq = moves;
  const fromBook = bookMove(seq);
  if (fromBook !== null) { pendingHint = { moves: seq, col: fromBook }; showHint(); return; }
  solver.then(w => {
    w.onmessage = e => {
      if (e.data.id !== solveId) return;
      pendingHint = { moves: e.data.moves, col: e.data.col };
      showHint();
    };
    w.postMessage({ id, moves: seq });
  });
}

// Opening book: the magician's best move for every spectator reply, encoded
// as a depth-first walk of the strategy tree (one digit per magician turn).

  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (listening && document.visibilityState === "visible") keepAwake(); });
async function startListening() {
  if (micStarting) return;
  micStarting = true;
  const ctx = soundUnlock();                      // inside the tap; session = play-and-record
  if (!ctx || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micStarting = false; listenFailed(); return; }
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  } catch (e) {
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e2) { mic = null; }
  }
  micStarting = false;
  if (!mic) { syncSession(); listenFailed(); return; }
  if (ctx.state !== "running") ctx.resume().catch(() => {});
  listening = true;
  listener = new ChimeListener(ctx.sampleRate, g => { stopListening(); revealBoard(g); });
  const src = ctx.createMediaStreamSource(mic);
  proc = ctx.createScriptProcessor(2048, 1, 1);
  proc.onaudioprocess = e => { if (listener) listener.feed(e.inputBuffer.getChannelData(0)); };
  const zero = ctx.createGain(); zero.gain.value = 0;
  src.connect(proc); proc.connect(zero); zero.connect(ctx.destination);
  keepAwake();
  updateTurn();                                   // the secret "it's listening" sign
}
// Couldn't listen (no microphone permission, or the page isn't on https):
// the turn discs blink twice instead of flipping.
function listenFailed() {
  const t = document.querySelector(".turn");
  t.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: 900 });
}
function stopListening() {
  listening = false; listener = null;
  if (proc) { proc.onaudioprocess = null; try { proc.disconnect(); } catch (e) {} proc = null; }
  if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; }
  syncSession();
  updateTurn();
}
// Show the received board as if the prediction game had ended that way.
function revealBoard(g) {
  const order = movesFor(g);
  if (!order) return;
  newGame();
  let last = null;
  for (const c of order) {
    const r = heights[c]++, p = turn;
    grid[c][r] = p; moves += c + 1; lastCol = c;
    const d = makeDisc(p); d.setAttribute("transform", `translate(${cx(c)} ${cy(r)})`); discEls[c][r] = d;
    turn = 3 - p; last = [c, r, p];
  }
  setHint(null);
  afterDrop(last[0], last[1], last[2], true);
}
// Long-press the restart button (~0.7 s) to start/stop listening.
// Touch is handled with touch events and preventDefault, so iOS can't turn the
// hold into a text-selection / callout gesture (which cancels the press).
// A short tap still starts a new game.
(function () {
  const btn = document.getElementById("restart");
  const LONG = 650;
  const toggle = () => { if (listening) stopListening(); else startListening(); };
  let touchAt = 0;
  btn.addEventListener("touchstart", e => { e.preventDefault(); touchAt = e.timeStamp || performance.now(); btn.classList.add("pressed"); }, { passive: false });
  btn.addEventListener("touchend", e => {
    e.preventDefault();
    btn.classList.remove("pressed");
    if (!touchAt) return;
    const held = (e.timeStamp || performance.now()) - touchAt;
    touchAt = 0;
    if (held >= LONG) toggle(); else newGame();
  }, { passive: false });
  btn.addEventListener("touchcancel", e => {
    btn.classList.remove("pressed");
    const held = (e.timeStamp || performance.now()) - touchAt;
    if (touchAt && held >= LONG) toggle();
    touchAt = 0;
  });
  // mouse
  let downAt = 0;
  btn.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") downAt = e.timeStamp; });
  btn.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") downAt = 0; });
  btn.addEventListener("pointerup", e => {
    if (e.pointerType !== "mouse") return;
    if (downAt && e.timeStamp - downAt >= LONG) { btn.dataset.long = "1"; toggle(); }
    downAt = 0;
  });
  btn.addEventListener("contextmenu", e => e.preventDefault());
})();

// Speaker button (next to the turn indicator).
const soundBtn = document.getElementById("sound");
function showSound() { soundBtn.classList.toggle("muted", MUTED); soundBtn.setAttribute("aria-label", MUTED ? "Sound off" : "Sound on"); }
soundBtn.addEventListener("click", () => {
  MUTED = !MUTED;
  try { localStorage.setItem("c4-mute", MUTED ? "1" : "0"); } catch (e) {}
  showSound();
  if (MUTED) syncSession(); else soundUnlock();
});
showSound();
document.addEventListener("pointerdown", () => { if (!MUTED || listening) soundUnlock(); }, { capture: true });

newGame();
</script>
</body>
</html>
